# Alembic configuration for QuantBlade.
#
# Usage (always run from the backend/ directory):
#   .venv/bin/python -m alembic upgrade head
#   .venv/bin/python -m alembic downgrade base
#   .venv/bin/python -m alembic revision --autogenerate -m "message"
#
# NOTE: `.venv/bin/alembic` (the console script) may be unusable because this
# virtualenv was created at a different path and its shebangs are stale.
# Prefer `python -m alembic`, which always resolves correctly.
#
# The database URL is intentionally NOT hardcoded here: env.py resolves it, in
# order, from (1) the DATABASE_URL environment variable, (2) `-x db_url=...`,
# and (3) app settings (.env). This keeps `alembic upgrade head` and the app
# pointed at the same database.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Leave sqlalchemy.url empty — env.py computes it at runtime.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
